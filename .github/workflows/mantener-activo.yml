# Objetivo: hacer una consulta liviana a la base de datos.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC = 8:00 a. m. en Colombia
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --silent --show-error --fail-with-body \
            "${SUPABASE_URL}/rest/v1/ajustes?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}"
