# Objetivo: hacer una consulta liviana a Supabase cada día.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC = 8:00 a. m. en Colombia
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a la base de datos
        run: |
          curl -sS -f "${{ secrets.SUPABASE_URL }}/rest/v1/ajustes?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
