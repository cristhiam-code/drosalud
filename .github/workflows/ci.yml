name: Verificaciones de DROSalud

on:
  pull_request:
  push:
    branches:
      - "qa/**"
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: drosalud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pruebas y sintaxis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas automáticas
        run: npm test
